# mypy 타입 검사 (개발용, 수집 스크립트 의존성이 아니다). CI 와 .githooks/pre-commit 이 쓴다.
# 스크립트는 scripts/ 를 sys.path 에 넣고 `import jobkit as K` 로 서로 불러오므로 scripts/ 를 최상위로 본다.
[mypy]
python_version = 3.10
mypy_path = scripts
explicit_package_bases = True
ignore_missing_imports = True
files = scripts

# 핵심 모듈은 모든 함수에 타입을 적는다 (#58). 다른 모듈은 타입이 적힌 함수만 검사한다
[mypy-jobkit,score,scan]
disallow_untyped_defs = True
disallow_incomplete_defs = True
