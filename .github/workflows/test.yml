# 테스트: main 에 올라오는 커밋과 모든 PR 에서.
#   tests   — 단위 테스트 (네트워크 없음) · OS 2 × Python 2 (지원 하한 3.10, 최신 3.12)
#   lint    — ruff (ruff.toml: 쓰지 않는 import·변수, 정의 안 된 이름 같은 실수), mypy (mypy.ini: 타입). 작업 이름 'ruff 린트'는 main 보호 규칙의 필수 검사라 그대로 둔다
#   privacy — data/ 의 개인 자료가 추적되고 있으면 실패 (scripts/privacy_check.py)
#   build   — Ubuntu 에서 scripts/setup.sh 로 설치한 뒤 예시 이력서를 디자인 A·B·C 로 빌드 (render.py 가 check.py 까지 돌린다)
#   package — 휠을 만들어 uv tool 로 설치한 jobhunt 명령이 저장소 밖에서 도는지 (함께 배포한 references/ 를 쓰는지)
#   migrate — 예전 git 설치(v1.1.0)에서 install.sh 로 전환: data/ 보존, .old-repo/, 스킬 다시 연결, cron 이어 주기, 재실행, jobhunt update, 중간에 멈춘 전환 이어 하기
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: PyYAML
        run: python -m pip install "PyYAML>=6.0"
      - name: 단위 테스트
        run: python -m unittest discover -s tests -v
      - name: 셸 스크립트 문법
        run: for f in install.sh scripts/*.sh; do bash -n "$f"; done

  lint:
    name: ruff 린트
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: ruff (규칙은 ruff.toml)
        run: |
          python -m pip install "ruff>=0.16,<0.17"
          ruff check --output-format=github .
      - name: mypy (설정은 mypy.ini)
        run: |
          python -m pip install "mypy>=2.4,<3" types-PyYAML
          mypy

  privacy:
    name: 개인 자료 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: data/ 허용 목록 밖의 추적 파일
        run: python3 scripts/privacy_check.py

  build:
    name: 이력서 빌드 (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 설치 (scripts/setup.sh — 패키지·Chromium·폰트·poppler)
        run: bash scripts/setup.sh --no-skill
      - name: 예시 이력서 빌드 · 검사
        run: |
          for d in A B C; do
            python3 scripts/render.py examples/example.yaml --profile data/profile/profile.example.yaml \
              --offline --design "$d" --out "$RUNNER_TEMP/resume-$d"
          done
      - name: 빌드 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resume-example
          path: ${{ runner.temp }}/resume-*/
          retention-days: 7

  package:
    name: uv 설치 (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: uv
        run: python -m pip install uv
      - name: 휠 빌드 · uv tool 설치
        run: |
          uv build --wheel -o dist
          uv tool install --python 3.12 dist/*.whl
      - name: 저장소 밖에서 jobhunt 명령
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$(uv tool dir --bin):$PATH" JOBHUNT_HOME="$RUNNER_TEMP/home"
          jobhunt --help
          jobhunt where
          jobhunt check "$GITHUB_WORKSPACE/examples/example.yaml" --offline
          printf '# 가나다랩 — 백엔드 개발자\n\n- URL: https://a.example/1\n\n## 자격요건\n- Go 3년 이상\n' > body.md
          jobhunt score init body.md | grep -q "Go 3년 이상"

  migrate:
    name: 설치 전환 (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0          # 예전 버전 태그(v1.1.0)로 git 설치를 흉내 낸다
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: uv
        run: python -m pip install uv
      - name: 예전 git 설치 흉내 (개인 파일 · 스킬 링크 · cron)
        run: |
          git clone -q --branch v1.1.0 "$GITHUB_WORKSPACE" "$HOME/jobhunt"
          echo "name: 가상" > "$HOME/jobhunt/data/profile/profile.yaml"
          mkdir -p "$RUNNER_TEMP/skills" && ln -s "$HOME/jobhunt" "$RUNNER_TEMP/skills/jobhunt"
          echo "0 9 * * 1 $HOME/jobhunt/scripts/weekly.sh" | crontab -
      - name: install.sh 로 전환
        run: |
          JOBHUNT_REPO="file://$GITHUB_WORKSPACE" JOBHUNT_REF="$(git rev-parse HEAD)" SKILLS_DIR="$RUNNER_TEMP/skills" \
            bash install.sh --skill-only | tee "$RUNNER_TEMP/first.log"
      - name: 전환 결과
        run: |
          set -x
          test "$(cat "$HOME/jobhunt/data/profile/profile.yaml")" = "name: 가상"
          test -d "$HOME/jobhunt/.old-repo/.git" && test -f "$HOME/jobhunt/.old-repo/SKILL.md"
          test ! -e "$HOME/jobhunt/SKILL.md" && grep -q "jobhunt where" "$HOME/jobhunt/AGENTS.md"
          test -f "$HOME/jobhunt/data/profile/targets.example.yaml"
          readlink "$RUNNER_TEMP/skills/jobhunt" | grep -q "site-packages/jobhunt"
          grep -q "jobhunt\" weekly" "$HOME/jobhunt/scripts/weekly.sh"
          "$(uv tool dir --bin)/jobhunt" where | grep -q "$HOME/jobhunt/data"
          grep -q "다음 버전" "$RUNNER_TEMP/first.log"
      - name: 다시 실행하면 이미 최신
        run: |
          JOBHUNT_REPO="file://$GITHUB_WORKSPACE" JOBHUNT_REF="$(git rev-parse HEAD)" SKILLS_DIR="$RUNNER_TEMP/skills" \
            bash install.sh --skill-only | tee "$RUNNER_TEMP/second.log"
          grep -q "이미 최신" "$RUNNER_TEMP/second.log"
      - name: jobhunt update 는 설치 절차 없이 같은 저장소에서 갱신
        run: |
          JOBHUNT_REF="$(git rev-parse HEAD)" "$(uv tool dir --bin)/jobhunt" update | tee "$RUNNER_TEMP/update.log"
          grep -q "이미 최신" "$RUNNER_TEMP/update.log"
          "$(uv tool dir --bin)/jobhunt" where | grep -q "$HOME/jobhunt/data"
      - name: 중간에 멈춘 전환을 다시 실행하면 이어서 옮김
        run: |
          half="$RUNNER_TEMP/half"
          git clone -q --branch v1.1.0 "$GITHUB_WORKSPACE" "$half"
          echo "name: 가상" > "$half/data/profile/profile.yaml"
          mkdir "$half/.old-repo" && mv "$half/SKILL.md" "$half/modes" "$half/.old-repo/"
          JOBHUNT_HOME="$half" JOBHUNT_REPO="file://$GITHUB_WORKSPACE" JOBHUNT_REF="$(git rev-parse HEAD)" SKILLS_DIR="$RUNNER_TEMP/skills-half" \
            bash install.sh --skill-only
          test "$(cat "$half/data/profile/profile.yaml")" = "name: 가상"
          test -f "$half/.old-repo/modes/scan.md" && test -f "$half/.old-repo/scripts/scan.py" && test -d "$half/.old-repo/.git"
          test ! -e "$half/scripts" && test ! -e "$half/.git"
